[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rfview"
version = "0.1.0"
description = "P1 core validation tools for SigMF and HDF5/RadioML RF datasets"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RFview" }]
license = { text = "MIT" }

[project.optional-dependencies]
hdf5 = ["h5py>=3.10", "numpy>=1.26"]
dev = ["pytest>=8"]

[project.scripts]
rfview = "rfview.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
